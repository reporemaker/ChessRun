name = "chessrun-stats"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# ÖNEMLİ: kapalı kalmalı. Access *rotanın* önünde duruyor; Worker hâlâ
# chessrun-stats.<hesap>.workers.dev adresinden erişilebilir olsaydı Access
# tamamen baypas edilir, tüm veri seti tahmin edilecek bir alan adı
# uzaklıkta kalırdı. Plandaki en olası güvenlik hatası bu.
workers_dev = false

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "chessrun"
# wrangler d1 create chessrun → çıkan id buraya
database_id = "b9a2a08a-ee26-48d1-828c-69c70d6228fc"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "SALT"
# wrangler kv namespace create SALT → çıkan id buraya
id = "f69b4bdcf4f14393a33b2f429ea5f73e"

[triggers]
# 00:05 UTC: tuzu döndür, dünü topla, 35 günü aşan ham satırları sil
crons = ["5 0 * * *"]

# --- Rotalar -----------------------------------------------------------
# Toplama APEX'te, yani oyunla aynı origin. Bu tesadüf değil: sendBeacon
# preflight yapamaz, çapraz origin'de oturum olayları iOS'ta sessizce
# kaybolur. Panel ayrı alan adında çünkü Access politikaları alan adı
# başına tanımlanıyor - tek alan adında "collect hariç" muafiyeti bir
# politika düzenlemesi uzaklıkta ya oyunu bozar ya veriyi açar.
#
[[routes]]
pattern = "chessrun.app/collect/*"
zone_name = "chessrun.app"

# Paylaşım bağlantıları (chessrun.app/s/?g=…): botlara og etiketleri, insana
# yönlendirme. Apex'te, herkese açık.
[[routes]]
pattern = "chessrun.app/s/*"
zone_name = "chessrun.app"

# Haftalık sıralama - apex'te, herkese açık, Access'in arkasında DEĞİL.
# Panel alan adına taşınsaydı oyuncular Access duvarına çarpardı.
[[routes]]
pattern = "chessrun.app/lb/*"
zone_name = "chessrun.app"

# Custom Domain (rota değil): Cloudflare DNS kaydını ve sertifikayı kendisi
# açıyor - elle AAAA 100:: kaydı gerekmiyor. Access hâlâ bu hostname'in önünde.
[[routes]]
pattern = "1403.chessrun.app"
custom_domain = true

# Panel derlemesi Worker ile birlikte yayınlanıyor - ayrı hosting yok.
# `cd sub && npm run build` sonrası wrangler deploy ikisini birden yollar.
[assets]
directory = "../sub/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# ÖNEMLİ (19 Ağustos denetimi): compat 2025-04-01+ ile tarayıcı GEZİNMELERİ
# (Sec-Fetch-Mode: navigate) önce varlık katmanına düşer ve eşleşme yoksa SPA
# index.html döner - Worker hiç çalışmaz. Paylaşım linkine tıklayan insan
# apex'te panelin boş sayfasını görüyordu (bot'lar og sayfasını alıyordu).
# Bu yollar HER ZAMAN önce Worker'a gelsin.
run_worker_first = ["/s/*", "/lb/*", "/collect/*", "/api/*"]

# Env tipi elle yazılmıyor: `npm run types` (wrangler types) →
# worker-configuration.d.ts. toml/.dev.vars değişince yeniden üret.
[vars]
ACCESS_TEAM = "round-bird-570f"
ACCESS_AUD = "2709e20e855156d8d8ec62453763ee9346ade2377147123663a8e523e6fa0ade"
