<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Maskelenebilir ikon: içerik güvenli bölgede (merkezin %80'i) kalmalı,
       köşeler kırpılabilir. Bu yüzden zemin tam kare, taş küçük ve ortada. -->
  <rect width="512" height="512" fill="#0e1015"/>
  <g fill="#94a3b4" opacity=".18">
    <rect x="128" y="128" width="64" height="64"/>
    <rect x="256" y="128" width="64" height="64"/>
    <rect x="192" y="192" width="64" height="64"/>
    <rect x="320" y="192" width="64" height="64"/>
    <rect x="128" y="256" width="64" height="64"/>
    <rect x="256" y="256" width="64" height="64"/>
    <rect x="192" y="320" width="64" height="64"/>
    <rect x="320" y="320" width="64" height="64"/>
  </g>
  <text x="256" y="336" font-size="224" text-anchor="middle" fill="#34d399"
        font-family="'Segoe UI Symbol','Apple Color Emoji','Noto Sans Symbols 2',serif">♞</text>
</svg>
